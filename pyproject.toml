[project]
name = "rag-doc-assistant"
version = "0.1.0"
description = "Local retrieval-augmented Q&A over your own documents"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
