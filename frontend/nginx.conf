server {
    listen 80;

    # Rejects oversized uploads before they reach the API. The API's own limit is 20 MB
    # (MAX_UPLOAD_MB); this leaves room for multipart overhead. See docs/decisions.md D18.
    client_max_body_size 25m;

    location /api/ {
        # The trailing slash strips the /api prefix: /api/health -> http://api:8000/health
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Answers on CPU can take a while.
        proxy_read_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
